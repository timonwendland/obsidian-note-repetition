name: Release

on:
    push:
        tags:
            - "[0-9]*.[0-9]*.[0-9]*"

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build, attest and release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check and build
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: pnpm check

            - name: Collect release files
              run: |
                  mkdir release
                  cp build/main.js manifest.json styles.css release/

            - name: Attest release files
              uses: actions/attest@v4
              with:
                  subject-path: |
                      release/main.js
                      release/manifest.json
                      release/styles.css

            - name: Extract release notes
              run: |
                  awk -v v="$GITHUB_REF_NAME" '
                      $0 == "## " v { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' CHANGELOG.md > notes.md
                  test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  gh release create "$GITHUB_REF_NAME"
                  release/main.js release/manifest.json release/styles.css
                  --repo "$GITHUB_REPOSITORY"
                  --title "Note Repetition $GITHUB_REF_NAME"
                  --notes-file notes.md
                  --verify-tag
